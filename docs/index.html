<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USD Economic Calendar</title>
<style>
  :root { color-scheme: light dark; --fg: #111; --bg: #fafafa; --muted: #666; --accent: #c62828; }
  @media (prefers-color-scheme: dark) { :root { --fg: #eee; --bg: #121212; --muted: #999; --accent: #ef5350; } }
  body { margin: 0; padding: 48px 16px; font: 16px/1.5 -apple-system, system-ui, sans-serif; color: var(--fg); background: var(--bg); }
  main { max-width: 440px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 24px; }
  a.btn { display: block; text-align: center; padding: 14px; border-radius: 12px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; }
  code { display: block; margin-top: 16px; font-size: 13px; color: var(--muted); word-break: break-all; }
</style>
</head>
<body>
<main>
  <h1>USD Economic Calendar</h1>
  <p>High impact US releases from Forex Factory, refreshed every 3 hours. 🔴 High impact · 🏦 Holidays </p>
  <a class="btn" id="sub" href="usd.ics">Subscribe on iPhone</a>
  <code id="url"></code>
</main>
<script>
  const base = location.host + location.pathname.replace(/[^/]*$/, "") + "usd.ics";
  document.getElementById("sub").href = "webcal://" + base;
  document.getElementById("url").textContent = "https://" + base;
</script>
</body>
</html>
